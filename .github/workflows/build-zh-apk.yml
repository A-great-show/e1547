name: Build Chinese APK

# 构建简体中文版 e1547 APK（非官方修改版，GPL-3.0）。
#
# 流程：checkout -> 安装 Flutter -> 生成/复用本 fork 的签名密钥 -> flutter pub get
#       -> tool/l10n/apply_zh.py 打汉化补丁 -> 打包「对应源码」
#       -> flutter build apk -> 发布 APK + 源码包 + LICENSE。
#
# 签名：release 变体必须能通过 validateSigningRelease。
# 上游在没有 android/keys/key.properties 时会回退到 debug 签名，而 CI 上不存在
# ~/.config/.android/debug.keystore，因此这里自举一套 fork 专用密钥：
# 第一次运行时生成 android/app/fork-release.jks 并提交回仓库，之后所有构建复用
# 同一个密钥 —— 这样 APK 签名跨构建稳定，用户可以直接覆盖安装升级。
#
# GPL-3.0 §6 要求分发目标码时同时提供「对应源码」，因此 Release 里会一并上传
# 打完补丁的源码压缩包（e1547-zh-cn-source.tar.gz）与许可证全文（LICENSE）。

on:
  workflow_dispatch:
  push:
    branches:
      - zh-cn
    paths-ignore:
      # 只改文档不重新打包；词条与代码的改动都要重新打包
      - '**.md'
      - 'tool/l10n/extracted.txt'
      - '.ci/**'

permissions:
  contents: write

concurrency:
  group: zh-apk-${{ github.ref }}
  cancel-in-progress: true

env:
  # 本 fork 的公开签名口令。密钥文件与口令都随仓库公开：任何人不需授权即可
  # 复现同样的签名，这是无 secrets 环境下保持签名稳定的唯一办法。
  KEYSTORE_PASSWORD: e1547zhcn
  KEYSTORE_ALIAS: e1547zhcn

jobs:
  android:
    name: Build APK (zh-CN)
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - name: setup actions
        uses: actions/checkout@v7

      - name: Setup Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: parse flutter version
        run: |
          export FLUTTER_VERSION=$(./.github/workflows/get_flutter_version.sh)
          echo "FLUTTER_VERSION=$FLUTTER_VERSION" >> $GITHUB_ENV

      - name: setup flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true

      # 缓存 ~/.gradle，避免每次重新下载 NDK/SDK/依赖
      - name: setup gradle cache
        uses: gradle/actions/setup-gradle@v4

      - name: environment info
        run: |
          java -version
          df -h /
          free -h

      # 生成（或复用）签名密钥。首次运行会生成并提交回仓库，之后每次构建都用同一把。
      - name: ensure signing key
        run: |
          set -e
          KEYSTORE_PATH="android/app/fork-release.jks"
          mkdir -p android/keys

          if [ ! -f "$KEYSTORE_PATH" ]; then
            keytool -genkeypair \
              -keystore "$KEYSTORE_PATH" \
              -storetype PKCS12 \
              -alias "$KEYSTORE_ALIAS" \
              -keyalg RSA -keysize 2048 -validity 10000 \
              -storepass "$KEYSTORE_PASSWORD" \
              -keypass "$KEYSTORE_PASSWORD" \
              -dname "CN=e1547 zh-CN unofficial fork, O=unofficial, C=CN"
          fi

          # storeFile 相对 android/app/ 解析（build.gradle.kts 里的 file(...)）
          cat > android/keys/key.properties <<EOF
          storeFile=fork-release.jks
          storePassword=$KEYSTORE_PASSWORD
          keyAlias=$KEYSTORE_ALIAS
          keyPassword=$KEYSTORE_PASSWORD
          EOF

          keytool -list -keystore "$KEYSTORE_PATH" -storepass "$KEYSTORE_PASSWORD" | tail -n 3

          # 把密钥提交回去，保证后续构建签名一致（这些文件被 .gitignore 忽略，需 -f）
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -f "$KEYSTORE_PATH" android/keys/key.properties
          if git diff --cached --quiet; then
            echo "签名密钥已存在，无需提交"
          else
            git commit -m "ci: 生成本 fork 的签名密钥（公开口令，供后续构建复用） [skip ci]"
            git push origin HEAD:zh-cn || echo "::warning::密钥提交失败，本次构建签名可能与上次不同"
          fi

      - name: get flutter dependencies
        run: flutter pub get

      - name: apply chinese patch
        run: python3 tool/l10n/apply_zh.py

      - name: verify patch
        run: |
          if git diff --quiet -- lib; then
            echo "::warning::汉化补丁没有修改任何文件，请检查 tool/l10n/zh_cn.json"
          else
            git diff --stat -- lib
          fi

      - name: package corresponding source
        run: |
          mkdir -p out
          # GPL-3.0 §6：随二进制提供「对应源码」，即打完汉化补丁后的完整源码树
          tar czf out/e1547-zh-cn-source.tar.gz \
            --exclude='./.git' \
            --exclude='./build' \
            --exclude='./.dart_tool' \
            --exclude='./.gradle' \
            --exclude='./out' \
            .
          cp LICENSE out/LICENSE
          ls -lh out

      - name: build APK
        run: |
          set -o pipefail
          flutter build apk --release 2>&1 | tee build.log

      - name: collect artifacts
        if: success()
        run: |
          cp build/app/outputs/flutter-apk/*.apk out/ 2>/dev/null || \
            cp build/app/outputs/apk/release/*.apk out/
          ls -lh out

      - name: upload artifacts
        if: success()
        uses: actions/upload-artifact@v7
        with:
          name: e1547-zh-apk
          path: |
            out/*.apk
            out/e1547-zh-cn-source.tar.gz
            out/LICENSE
          retention-days: 30

      - name: publish to releases
        if: success()
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          TAG="zh-cn-latest"
          NOTES=$(cat <<'EOF' | sed 's/^[[:space:]]*//'
          e1547 简体中文版 —— **非官方修改版**（基于 GPL-3.0 授权的 clynamic/e1547 修改）

          **修改声明（GPL-3.0 §5(a)）**：本构建由 A-great-show 于 2026 年起持续修改，
          修改内容为界面文案简体中文化（构建期字符串补丁）与应用内固定 `zh_CN` locale。
          与原作者 clragon 无关，未获其背书。

          **包含文件**

          * `app-arm64-v8a-release.apk` — 现代手机（2019 年后）
          * `app-armeabi-v7a-release.apk` — 旧设备
          * `app-universal-release.apk` — 不确定时选这个
          * `e1547-zh-cn-source.tar.gz` — **对应源码**（已应用汉化补丁，GPL-3.0 §6）
          * `LICENSE` — GNU GPL v3.0 全文

          **安装提示**：本包使用本 fork 自己的签名密钥（`android/app/fork-release.jks`，口令公开），
          与 Google Play / 官方 Release 的签名不同。若已安装官方版，请先卸载再安装。
          同一来源的后续版本可以直接覆盖升级。

          **构建可复现**：`flutter pub get && python3 tool/l10n/apply_zh.py && flutter build apk --release`

          本构建同样以 GNU GPL v3.0 发布；再分发请遵守该许可证。
          EOF
          )
          gh release view "$TAG" >/dev/null 2>&1 || gh release create "$TAG" \
            --title "e1547 简体中文版（自动构建）" \
            --notes "$NOTES" \
            --prerelease
          gh release edit "$TAG" --notes "$NOTES"
          gh release upload "$TAG" out/* --clobber

      # 失败时把日志提交回仓库（.ci/last-build-error.log），便于直接排查
      - name: record failure log
        if: failure()
        run: |
          mkdir -p .ci
          {
            echo "run: ${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}"
            echo "sha: ${GITHUB_SHA}"
            echo
            echo "=== disk ==="
            df -h / || true
            echo "=== memory ==="
            free -h || true
            echo
            if [ -f build.log ]; then
              echo "=== build.log tail (400 lines) ==="
              tail -n 400 build.log
            else
              echo "build.log 未生成：失败发生在 flutter build 之前"
            fi
          } > .ci/last-build-error.log
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -f .ci/last-build-error.log
          git commit -m "ci: 记录构建失败日志 [skip ci]" || true
          git push origin HEAD:zh-cn || true
