name: Build Chinese APK

# 构建简体中文版 e1547 APK（非官方修改版，GPL-3.0）。
#
# 流程：checkout -> 安装 Flutter（版本取自 pubspec.yaml）-> flutter pub get
#       -> tool/l10n/apply_zh.py 打汉化补丁 -> 打包「对应源码」
#       -> flutter build apk -> 发布 APK + 源码包 + LICENSE。
#
# GPL-3.0 §6 要求分发目标码时同时提供「对应源码」，因此 Release 里会一并上传
# 打完补丁的源码压缩包（e1547-zh-cn-source.tar.gz）与许可证全文（LICENSE）。
#
# 构建失败时会把 build.log 末尾提交到 .ci/last-build-error.log，便于排查
# （fork 的 Issues 默认关闭，且 job 原始日志需要鉴权，无法直接读取）。

on:
  workflow_dispatch:
  push:
    branches:
      - zh-cn
    paths-ignore:
      # 只改文档不重新打包；词条与代码的改动都要重新打包
      - '**.md'
      - 'tool/l10n/extracted.txt'
      - '.ci/**'

permissions:
  contents: write

concurrency:
  group: zh-apk-${{ github.ref }}
  cancel-in-progress: true

jobs:
  android:
    name: Build APK (zh-CN)
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - name: setup actions
        uses: actions/checkout@v7

      - name: Setup Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: parse flutter version
        run: |
          export FLUTTER_VERSION=$(./.github/workflows/get_flutter_version.sh)
          echo "FLUTTER_VERSION=$FLUTTER_VERSION" >> $GITHUB_ENV

      - name: setup flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true

      # 缓存 ~/.gradle，避免每次重新下载 NDK/SDK/依赖（首次约 8 分钟，缓存后明显更快）
      - name: setup gradle cache
        uses: gradle/actions/setup-gradle@v4

      - name: environment info
        run: |
          java -version
          echo "ANDROID_HOME=$ANDROID_HOME"
          df -h /
          free -h

      - name: get flutter dependencies
        run: flutter pub get

      - name: apply chinese patch
        run: python3 tool/l10n/apply_zh.py

      - name: verify patch
        run: |
          if git diff --quiet; then
            echo "::warning::汉化补丁没有修改任何文件，请检查 tool/l10n/zh_cn.json"
          else
            git diff --stat
          fi

      - name: package corresponding source
        run: |
          mkdir -p out
          # GPL-3.0 §6：随二进制提供「对应源码」，即打完汉化补丁后的完整源码树
          tar czf out/e1547-zh-cn-source.tar.gz \
            --exclude='./.git' \
            --exclude='./build' \
            --exclude='./.dart_tool' \
            --exclude='./.gradle' \
            --exclude='./out' \
            .
          cp LICENSE out/LICENSE
          ls -lh out

      - name: build APK
        run: |
          set -o pipefail
          flutter build apk --release 2>&1 | tee build.log

      - name: collect artifacts
        if: success()
        run: |
          cp build/app/outputs/flutter-apk/*.apk out/ 2>/dev/null || \
            cp build/app/outputs/apk/release/*.apk out/
          ls -lh out

      - name: upload artifacts
        if: success()
        uses: actions/upload-artifact@v7
        with:
          name: e1547-zh-apk
          path: |
            out/*.apk
            out/e1547-zh-cn-source.tar.gz
            out/LICENSE
          retention-days: 30

      - name: publish to releases
        if: success()
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          TAG="zh-cn-latest"
          NOTES=$(cat <<'EOF' | sed 's/^[[:space:]]*//'
          e1547 简体中文版 —— **非官方修改版**（基于 GPL-3.0 授权的 clynamic/e1547 修改）

          **修改声明（GPL-3.0 §5(a)）**：本构建由 A-great-show 于 2026 年起持续修改，
          修改内容为界面文案简体中文化（构建期字符串补丁）与应用内固定 `zh_CN` locale。
          与原作者 clragon 无关，未获其背书。

          **包含文件**

          * `app-arm64-v8a-release.apk` — 现代手机（2019 年后）
          * `app-armeabi-v7a-release.apk` — 旧设备
          * `app-universal-release.apk` — 不确定时选这个
          * `e1547-zh-cn-source.tar.gz` — **对应源码**（已应用汉化补丁，GPL-3.0 §6）
          * `LICENSE` — GNU GPL v3.0 全文

          **安装提示**：本包为 debug 签名，与官方版本签名不同。若已安装官方版，请先卸载，
          否则会提示「应用未安装」。请勿用官方公开的证书指纹校验本包。

          **构建可复现**：`flutter pub get && python3 tool/l10n/apply_zh.py && flutter build apk --release`

          本构建同样以 GNU GPL v3.0 发布；再分发请遵守该许可证。
          EOF
          )
          gh release view "$TAG" >/dev/null 2>&1 || gh release create "$TAG" \
            --title "e1547 简体中文版（自动构建）" \
            --notes "$NOTES" \
            --prerelease
          gh release edit "$TAG" --notes "$NOTES"
          gh release upload "$TAG" out/* --clobber

      # 失败时把日志提交回仓库（.ci/last-build-error.log），这样可以直接排查
      - name: record failure log
        if: failure()
        run: |
          mkdir -p .ci
          {
            echo "run: ${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}"
            echo "sha: ${GITHUB_SHA}"
            echo
            echo "=== java ==="
            java -version 2>&1 || true
            echo "=== disk ==="
            df -h / || true
            echo "=== memory ==="
            free -h || true
            echo
            if [ -f build.log ]; then
              echo "=== build.log tail (400 lines) ==="
              tail -n 400 build.log
            else
              echo "build.log 未生成：失败发生在 flutter build 之前"
            fi
          } > .ci/last-build-error.log
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -f .ci/last-build-error.log
          git commit -m "ci: 记录构建失败日志 [skip ci]" || true
          git push origin HEAD:zh-cn || true
